services:
  # 1. Redis Broker & Cache
  redis:
    image: redis:7-alpine
    container_name: audio_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 2. FastAPI Web Gateway
  api:
    build: .
    container_name: audio_api
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - upload_data:/tmp/uploads
      - ./src:/app/src
      - ./index.html:/app/index.html
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    container_name: audio_worker
    command: celery -A src.celery_app.celery_app worker --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - upload_data:/tmp/uploads
    depends_on:
      redis:
        condition: service_healthy

volumes:
  upload_data: